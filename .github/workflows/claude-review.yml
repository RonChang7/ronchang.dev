# 獨立版 Claude PR review workflow
# 給不能呼叫 dotfiles reusable workflow 的 repo 用：
#   - 別的擁有者（例如 my83-org）
#   - public repo（不能呼叫 private repo 的 reusable workflow）
# review 規則在執行時從 RonChang7/dotfiles 的 .claude/agents/open-hands.md 讀取，改規則只改那個檔案。
# 刻意讀 main 的最新版、不鎖 commit SHA。open-hands.md 不要放敏感資訊：public repo 的 review 有機會把內容貼出來。
#
# 前置設定：
#   - secret CLAUDE_CODE_OAUTH_TOKEN（claude setup-token 產生）
#   - secret DOTFILES_READ_TOKEN（只能讀 dotfiles 的 fine-grained token）
# pull_request_target 跑的是 PR 目標分支上的這個檔案，PR 會開到哪些分支，這個檔案就要放在哪些分支上。

name: Claude Review

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout PR head (read only)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false

      - name: Check DOTFILES_READ_TOKEN
        env:
          TOKEN: ${{ secrets.DOTFILES_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::缺少 secret DOTFILES_READ_TOKEN，無法讀取 review 規則"
            exit 1
          fi

      - name: Fetch review rules from dotfiles
        uses: actions/checkout@v6
        with:
          repository: RonChang7/dotfiles
          token: ${{ secrets.DOTFILES_READ_TOKEN }}
          path: _dotfiles
          sparse-checkout: .claude/agents/open-hands.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # 只把規則檔複製出來，再刪掉 _dotfiles，讓 Claude 讀不到 dotfiles 的 .git 和其他內容
      - name: Prepare review rules
        run: |
          src=_dotfiles/.claude/agents/open-hands.md
          mkdir -p review-rules
          cp "$src" review-rules/open-hands.md
          rm -rf _dotfiles

      - name: Code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model opus
            --add-dir pr-head
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR 的完整檔案在 pr-head/ 資料夾。用 `gh pr diff` 取得變更內容。

            Review 規則：先讀 review-rules/open-hands.md，照裡面的角色、任務和審查場景 review 這個 PR。
            open-hands.md 只決定「審什麼」。輸出格式一律照下面的 CI 規定，不照 open-hands.md 裡的輸出範例。

            CI 輸出規定：
            1. 每個具體問題用 inline comment 留在對應的行上。開頭標分類：🛠️ 風格、🔍 可讀性、🔐 安全風險；open-hands.md 有其他場景時，沿用它的名稱和 emoji。內容寫為何這是問題、建議的改善方式。
            2. 最後用 `gh pr comment` 留一則總結，依審查場景分組，列出問題數量與最重要的幾點。沒有問題就只寫一行「沒有發現需要修改的地方」。
            3. 一律使用台灣正體中文與台灣慣用語，技術術語維持原文。只講重點，不要複述程式碼。
            4. 只審查這個 PR 變更到的部分。不要修改任何檔案。
